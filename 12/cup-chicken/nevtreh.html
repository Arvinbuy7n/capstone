  </head>
  <body>
    <div
      style="
        background-color: rgb(235, 191, 124);
        height: 70px;
        display: flex;
        justify-content: space-around;
        align-items: center;
      "
    >
      <a href="/CupChicken.html"
        ><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-IYLxJ2dW2-BxwyIlh_-g-0zmzh9_h3DSaw&s"
          style="height: 70px"
      /></a>
      <a
        href="/zahialgiinyavts.html"
        style="text-decoration: none; color: brown"
        ><h1>Захиалгын явц</h1></a
      >
      <a href="salbar.html" style="text-decoration: none; color: brown"
        ><h1>Салбаруудын мэдээлэл</h1></a
      >

      <a href="/ajliinbair.html" style="text-decoration: none; color: brown"
        ><h1>Ажлын байр</h1></a
      >
      <a href="bidniituhai.html" style="text-decoration: none; color: brown"
        ><h1>Бидний тухай</h1></a
      >
      <a href="/nevtreh.html" style="text-decoration: none; color: brown"
        ><h1>Нэвтрэх</h1></a
      >
    </div>
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      "
    >
      <form
        action="#"
        method="post"
        style="
          background: white;
          padding: 50px 60px;
          border-radius: 30px;
          border: 4px solid #ffc13d;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
          text-align: center;
          width: 420px;
          max-width: 90%;
        "
      >
        <p
          style="
            font-size: 40px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
          "
        >
          Нэвтрэх
        </p>

        <input
          type="text"
          name="phone"
          placeholder="Утасны дугаар"
          style="
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 30px;
            border: 2px solid #eee;
            font-size: 20px;
            outline: none;
          "
        />

        <input
          type="password"
          name="password"
          placeholder="Нууц үг"
          style="
            width: 100%;
            padding: 18px;
            margin-bottom: 25px;
            border-radius: 30px;
            border: 2px solid #eee;
            font-size: 20px;
            outline: none;
          "
        />

        <button
          type="submit"
          style="
            background: #ffc74e;
            border: none;
            padding: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
          "
        >
          Нэвтрэх
        </button>

        <p
          class="hover-text"
          style="margin-top: 20px; font-size: 18px; color: #666"
        >
          Нууц үг мартсан уу?
        </p>
      </form>

      <style>
        .hover-text {
          transition: 0.3s;
        }

        .hover-text:hover {
          color: #ffbb00;
          cursor: pointer;
        }
      </style>
    </div>
  </body>
</html>
