<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 
    .btn {
        background-color: black;
        color: white;
        transition: all 0.3s ease;
    } 
    .btn1 {
        background-color: black;
        color: white;
        transition: all 0.3s ease;
    }

    .btn:hover {
        background-color: white;
        color: black;
        transform: scale(1.1);
    }

    
    .btn:hover + .btn1 {
        background-color: red;
        transform: scale(1.2);
    }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; flex-direction: column; align-items: center; height: 100vh;"> 
        <button class="btn"; style="height: 100px; width: 200px; border-radius: 10px;"> Hover Me!</button>
         <button class="btn1"; style="height: 100px; width: 200px; border-radius: 10px;"> Hover Me!</button>
          <button class="btn1"; style="height: 100px; width: 200px; border-radius: 10px;"> Hover Me!</button>

    </div>
</body>
</html>
