<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOSAIC — Log In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: #1f1f30;
    color: #f5f0e8;
    min-height: 100vh;
  }

  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 60px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    position: sticky;
    top: 0;
    background-color: rgba(31,31,48,0.92);
    backdrop-filter: blur(10px);
    z-index: 100;
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.15em;
    font-size: 1.5rem;
    color: #f5f0e8;
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    transition: color 0.2s;
    text-transform: uppercase;
  }
  .nav-links a:hover, .nav-links a.active { color: #f5f0e8; }
  .nav-subscribe {
    background-color: transparent;
    color: #f5f0e8;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 1000px;
    padding: 8px 22px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .nav-subscribe:hover {
    background-color: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.5);
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 65px);
    padding: 60px 24px;
    background-image: url(https://upload.wikimedia.org/wikipedia/commons/0/05/Hobby_School_new_building.jpg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    gap: 32px;
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(15,15,28,0.72);
  }
  .hero > * { position: relative; z-index: 1; }

  .hero-text {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .hero-eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 16px;
    border-radius: 100px;
    margin: 0 auto;
  }
  .hero-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: #fff;
    line-height: 1.1;
  }
  .hero-text p {
    font-size: 0.9rem;
    color: rgba(255,235,235,0.6);
    letter-spacing: 0.03em;
  }

  .login-card {
    background-color: rgba(20,20,38,0.80);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .login-card label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 4px;
    display: block;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .login-card input {
    width: 100%;
    height: 46px;
    background-color: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: #f5f0e8;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    padding: 0 16px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .login-card input::placeholder { color: rgba(255,255,255,0.28); }
  .login-card input:focus {
    border-color: rgba(255,255,255,0.35);
    background-color: rgba(255,255,255,0.1);
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 4px 0;
  }

  .btn-primary {
    width: 100%;
    height: 46px;
    background-color: #f5f0e8;
    color: #1f1f30;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.88; }

  .btn-ghost {
    width: 100%;
    height: 42px;
    background-color: transparent;
    color: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .btn-ghost:hover {
    background-color: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.28);
    color: #f5f0e8;
  }

  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 60px 40px 40px;
    background-color: #141422;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .footer-logo {
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.15em;
    font-size: 1.5rem;
    color: #f5f0e8;
  }
  .footer-links { display: flex; gap: 36px; flex-wrap: wrap; justify-content: center; }
  .footer-links a {
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: #f5f0e8; }
  .footer-copy { font-size: 0.78rem; color: rgba(255,255,255,0.22); letter-spacing: 0.04em; }

  @media (max-width: 600px) {
    .nav { padding: 14px 20px; }
    .nav-links { display: none; }
    .login-card { padding: 32px 24px; }
  }
</style>
</head>
<body>

  <nav class="nav">
    <a href="zev.html" class="nav-logo">MOSAIC</a>
    <div class="nav-links">
      <a href="munkhjin.html">Activities</a>
      <a href="sergelen.html">About Us</a>
      <a href="iveel.html">Archive</a>
      <a href="narangoo.html" class="active">Log In</a>
    </div>
    <a href="https://www.instagram.com/mosaichobbyschool?igsh=MWh6M2dxc2thcWNkdg=="><button class="nav-subscribe">Subscribe</button></a>
  </nav>

    <div class="hero">
    <div class="hero-text">
      <h1>Log In</h1>
      <p>Welcome to Mosaic Newspaper Club</p>
    </div>

    <div class="login-card">
      <div class="input-group">
        <label>Email or phone number</label>
        <input type="text" placeholder="you@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••">
      </div>

      <div class="divider"></div>

      <button class="btn-primary">Log In</button>
      <button class="btn-ghost">Forgot password</button>
      <button class="btn-ghost">Create new account</button>
    </div>
  </div>

  <footer>
    <span class="footer-logo">MOSAIC</span>
    <div class="footer-links">
      <a href="munkhjin.html">Activities</a>
      <a href="sergelen.html">About Us</a>
      <a href="iveel.html">Archive</a>
      <a href="narangoo.html">Log In</a>
    </div>
    <hr style="width:100%; border:none; border-top:1px solid rgba(255,255,255,0.1);">
    <p class="footer-copy">© 2025 Mosaic Newspaper · Hobby School of Ulaanbaatar</p>
  </footer>

</body>
</html>
