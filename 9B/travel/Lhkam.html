<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        font-weight: 400;
      }

      .custombutton {
        border: 0;
        background-color: rgba(0, 0, 0, 0);
        font-size: 24px;
      }

      .custombutton:hover {
        background-color: rgb(200, 200, 200);
      }

      .secondbutton {
        width: 150px;
        height: 50px;
        border-radius: 25px;
        color: aliceblue;
        background-color: transparent;
        border-color: bisque;
      }

      .secondbutton:hover {
        width: 160px;
        height: 70px;
        background-color: beige;
        color: navy;
      }
      .buttonsign:hover {
        width: 190px;
        height: 35px;
        background-color: grey;
      }
      @keyframes slide {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 612px 612px;
        }
      }
      .container {
        display: flex;
        gap: 20px;
      }

      .card {
        border: 1px solid gray;
        padding: 10px;

        width: 33%;
      }

      .card:hover {
        scale: 1.1;
      }

      .card img {
        width: 100%;
        height: 250px;
      }
    </style>
  </head>

  <body
    style="
      font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-image: url(https://img.freepik.com/free-vector/seamless-plaid-background-gray-pattern-design-vector_53876-176421.jpg?semt=ais_hybrid&w=740&q=80);
      background-color: rgb(225, 225, 225, 0.85);
      background-blend-mode: lighten;
      background-repeat: repeat;
      animation: slide 20s linear infinite;
    "
  >
    <div style="display: flex; justify-content: center; width: 100%">
      <div
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 35px;
          border-bottom: 1px solid black;
          width: 100vh;
          height: 10vh;
        "
      >
        <img
          src="https://upload.wikimedia.org/wikipedia/wikimania/6/65/Singapore_Tourism_Board_logo.png"
          alt="logo"
          style="height: 70px; width: 180px"
        />
        <button class="custombutton">Tours</button>
        <button class="custombutton">Hotels</button>
        <button class="custombutton">Blog</button>
        <button class="custombutton">About</button>
        <button class="custombutton">Contact</button>
        <button class="custombutton">Review</button>
        <button
          style="
            width: 65px;
            height: 35px;
            background-color: transparent;
            border-color: gray;
            border: 1px solid black;
            border-radius: 100ch;
            font-weight: 80px;
          "
        >
          search
        </button>
        <button
          style="
            width: 190px;
            height: 35px;
            background-color: transparent;
            border-color: gray;
            border: 1px solid black;
            border-radius: 100ch;
          "
          class="buttonsign"
        >
          sign in
        </button>
      </div>
    </div>

    <!-- <div style="border: 1px solid red; pad"></div> -->
    <div
      style="
        margin-left: 10vw;
        width: 80vw;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 2vh;
      "
    >
      <h1
        style="
          font-size: 80px;
          font-family:
            &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
          font-weight: 80px;
          padding: 0;
          margin: 0;
          color: black;
        "
      >
        Singapore
      </h1>
      <h2
        style="
          color: rgb(45, 9, 9);
          text-align: center;
          padding: 0;
          width: 80vw;
          margin: 0;
          font-weight: 100;
        "
      >
        The seamless mix of technology,innovation,and natural beauty
      </h2>
    </div>

    <div
      style="
        background-image: url(https://www.plonkit.net/images/singapore/Screenshot_2022-11-22_202003.png);
        background-repeat: no-repeat;
        background-size: cover;
        height: 600px;
      "
    >
      <img
        src="https://cdn2.cdnstep.com/nE7Jzg8VdTa7U3jTur1V/2-1.png"
        alt=""
        style="
          position: absolute;
          right: 0;
          top: 0;
          width: 170px;
          height: 165px;
          z-index: 2;
        "
      />
    </div>

    <h1 style="">Unique Experiences to try in Singapore</h1>
    <div class="container">
      <div class="card">
        <img src="https://media.rezgo.com/2384/34406/169268.jpg" width="300" />

        <h2>Bird Paradise</h2>

        <p>Take flight to Asia's largest bird park.</p>
      </div>

      <div class="card">
        <img
          src="https://nowboarding.changiairport.com/content/dam/canowboarding/article-assets/live-local/nature-therapy--explore-forest-bathing-in-singapore/Forest%20bathing.jpg"
          width="300"
        />

        <h2>Forest Bathing</h2>

        <p>Relax and enjoy nature in the forest.</p>
      </div>

      <div class="card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeoLN9InwdhJ9s5AWh9Ogn0J7VNvXMcsr-Rw&s"
          width="300"
        />

        <h2>Mystery Golf</h2>

        <p>Solve puzzles and play mini golf.</p>
      </div>
    </div>
  </body>
</html>
