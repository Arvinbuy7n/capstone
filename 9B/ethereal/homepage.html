<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Anta&display=swap");

      :root {
        --purple-main: #9d4edd;
        --purple-dark: #370057;
        --glass: rgba(255, 255, 255, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Anta", sans-serif;
      }

      body {
        background: radial-gradient(circle at center, #370057, #010101);
        color: white;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Layout */
      .container {
        display: flex;
      }

      /* Sidebar */
      .sidebar {
        width: 250px;
        height: 100vh;
        position: sticky;
        top: 0;
        border-right: 1px solid var(--purple-main);
        display: flex;
        flex-direction: column;
        padding: 20px 0;
      }

      .logo-container {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo-container img {
        max-width: 80%;
        filter: drop-shadow(0 0 10px var(--purple-main));
      }

      /* Main Content */
      .main-content {
        flex: 1;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      /* Header Section */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand-name {
        font-size: 3rem;
        background: linear-gradient(45deg, #fff, var(--purple-main));
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 4px;
      }

      #searchgame {
        padding: 10px 20px;
        border-radius: 20px;
        border: 1px solid var(--purple-main);
        background: var(--glass);
        color: white;
        outline: none;
      }

      /* Game Cards */
      .section-title {
        font-size: 1.2rem;
        color: #c77dff;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
      }

      .featured-game {
        width: 100%;
        height: 400px;
        background-image: url("https://baggycat.com/media/DONbanner.jpg");
        background-size: cover;
        background-position: center;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 210, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        transition: transform 0.3s ease;
        cursor: pointer;
      }

      .featured-game:hover {
        transform: scale(1.01);
        box-shadow: 0 0 20px orangered;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .game-card {
        height: 350px;
        border-radius: 15px;
        background-size: cover;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .game-card:hover {
        transform: translateY(-10px) scale(1.02);
        border-color: var(--purple-main);
        box-shadow: 0 0 20px var(--purple-main);
      }

      /* Navigation Buttons */
      .btn {
        background: none;
        border: none;
        color: #e0aaff;
        padding: 15px 25px;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        font-size: 1.1rem;
        transition: 0.3s;
        cursor: pointer;
      }

      .btn:hover {
        background: var(--glass);
        color: white;
        padding-left: 35px;
      }

      .btn svg {
        stroke: var(--purple-main);
      }
    </style>
  </head>
  <body>

            stroke-linecap="round"

            <rect width="18" height="18" x="3" y="3" rx="2" />

        <button class="btn">

        <div

            margin-top: auto;

          9B Enkh-Amgalan, Ashid-Erdene, Bat-Ider, Tsatsral, Suvd

      </nav>

      <main class="main-content">
        <header class="header">
          <h1 class="brand-name">ETHEREAL</h1>
          <input type="search" id="searchgame" placeholder="Search games..." />

        <section>

        <section>

          <div class="game-grid">

      </main>

  </body>
</html>
