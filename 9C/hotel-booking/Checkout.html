<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel booking checkout</title>
      <style>
      body {
        margin: 0;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: whitesmoke;
        padding: 0 20px;
      }
      nav {
        display: flex;
        gap: 20px;
        font-size: 20px;
      }
      a {
        text-decoration: none;
        color: black;
        font-weight: bold;
      }
      a:hover {
        text-decoration: underline;
      }
      .right-section {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      button {
        color: black;
        background-color: white;
        border-radius: 2px;
        border: 1px solid #ccc;
        padding: 5px 10px;
      }
      img {
        border: 2px solid #333;
        border-radius: 5px;
      }
      main {
        padding: 20px;
      }
      .map {
        margin: 20px auto;
        max-width: 600px;
      }
      .features {
        background-size: cover;
        background-position: center;
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: black;
      }
      .about {
        padding: 40px;
        background-color: #f4f4f4;
        text-align: center;
      }
      .about h2 {
        color: #333;
      }
      .about p {
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.6;
      }
      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 20px;
      }
      footer ul {
        list-style: none;
        padding: 0;
      }
      footer li {
        display: inline;
        margin: 0 10px;
      }
      footer a {
        color: white;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
  <header>
    <h1><a href="Bookings.html" style="text-decoration:none;color:inherit;">KingHotel.com</a></h1>
    <nav>
      <a href="Bookings.html">Bookings</a>
      <a href="Info.html">Info</a>
      <a href="Attraction.html">Attraction</a>
      <a href="Location.html">Location</a>
      <a href="Checkout.html">Checkout</a>
    </nav>
    <div class="right-section">
      <p>MNT</p>
      <img
        src="https://t3.ftcdn.net/jpg/11/91/83/34/360_F_1191833439_sBXI6p9sKU6Y8gVpObtRy8VCdjRpS6hQ.jpg"
        alt="Mongolian Flag"
        width="30"
        height="20"
      />
      <button style="border-radius: 99px; background-color: black; color: white">Register</button>
      <button style="border-radius: 99px; background-color: black; color: white">Sign in</button>
    </div>
  </header>

    <div style="display: flex; justify-content: center">
      <div
        style="
          width: 650px;
          height: 1000px;
          background-color: rgb(239, 239, 246);
          display: flex;
          justify-content: center;
          align-items: center;
          margin-top: 100px;
          border-radius: 30px;
          border-color: rgb(195, 197, 200);
          gap: 100px;
        "
      >
        <div style="display: flex; justify-content: space-evenly; width: 75%">
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              width: 470px;
              height: 820px;
              color: black;
              border-style: solid;
              border-radius: 20px;
              padding: 10px;
              margin-left: 20px;
            "
          >
            <h2>Name</h2>
            <input type="text" placeholder="Duurendalai" />
            <h2>Your country</h2>
            <input type="text" placeholder="Choose" />
            <h2>Email</h2>
            <input type="email" name="" id="" placeholder="example@gmail.com" />
            <h2>Your Age</h2>
            <input type="date" />
            <h2>Phone number</h2>
            <input type="number" name="" id="" placeholder="+1234567890" />

            <h1>Payment Detail</h1>
            <h2>Card Number</h2>
            <input type="number" placeholder="1234 5678 9012" />
            <h2>Card holder name</h2>
            <input type="text" placeholder="Card holder name" />
          </div>
          <div
            class="summary"
            style="
              width: 370px;
              height: 420px;
              color: black;
              border-style: solid;
              border-radius: 20px;
              padding: 10px;
              margin-left: 20px;
            "
          >
            <h3>Booking Summary</h3>

            <p>Room Type: <strong></strong></p>
            <p>
              Check In: <strong><input type="date" /></strong>
            </p>
            <p>
              Check Out: <strong><input type="number" /></strong>
            </p>
            <p>
              Nights: <strong><input type="number" placeholder="1-7" /></strong>
            </p>

            <p>Room Price: <input type="number" /></p>
            <p>Taxes & Fees: <input type="number" /></p>
            <input type="submit" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
